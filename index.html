<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Matches --canvas in src/styles/tokens.css. TRUTH.md §9: dark field, maroon only. -->
    <meta name="theme-color" content="#120A0E" />
    <title>TapIn · Blacksburg</title>
    <!--
      THE TAPIN PLUS PAPER MARK (Sam, 10 Nov 2026), the collage mark in
      public/brand/plus-paper-mark.svg, rendered to PNG: the SVG's paper
      filters, and Safari, which ignores SVG favicons, both need a bitmap.
      Transparent for the tab; tapin_plus_icon.png sits on white for the iOS
      home screen, which fills a transparent icon with black. Re-render all
      three from the SVG if it changes. "?v=paper" drops cached icons.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=paper" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png?v=paper" />
    <link rel="apple-touch-icon" href="/tapin_plus_icon.png?v=paper" />
    <!-- Speed (PageSpeed, 9 Nov 2026): the two Gilroy weights the first
         screen sets, fetched with the page; the first screen's photograph
         asked for before the app's code runs (hero-preload.js, async). -->
    <link rel="preload" href="/fonts/Gilroy-SemiBold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Gilroy-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <script async src="/hero-preload.js"></script>
    <!--
      DIRECTION · desktop, 14 Sep 2026
      THESIS: one argument in four movements — statement, evidence, decision,
        close — on alternating grounds. Refuses the category page: a stack of
        same-tone rounded panels widened from the phone.
      OWN-WORLD: TapIn's dark plum ramp; Chicago Maroon spent only on the acting
        or chosen thing; Gilroy; flat card + floating tile; merchant photography
        as the only colour on the page.
      STORY: a student reads the money in one line, checks the six real places,
        sees what her own spend returns, weighs two plans, reserves — refundable.
      FIRST VIEWPORT (1440): solid plum panel left (wordmark, thesis, price,
        action, refund, six marks) meeting six landscape photographs on a hard
        vertical seam under a maroon announcement bar.
      FORM: hard-split hero (Sam's pick from a Mobbin review, 13 Sep) over the
        four movements. No seed roll: the world and the hero were pinned; only
        the composition below was open.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
